<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventHub</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<header class="navbar">

<div class="logo">
<div class="circle"></div>
<h1>EventHub</h1>
</div>

<nav>
<a href="/">Início</a>
<a href="/eventos.html">Eventos</a>
<a href="/contato.html">Contato</a>
<a href="/logout">Sair</a>
</nav>

</header>

<main class="container">

<section class="left">

<span class="badge">
Plataforma de Eventos
</span>

<h2>
Gerencie e participe de eventos com facilidade
</h2>

<p>
Sistema desenvolvido com Node.js, Express e MongoDB utilizando arquitetura MVC.
</p>

<div class="cards">

<div class="info-card">
<h3>CRUD</h3>
<p>Eventos completos</p>
</div>

<div class="info-card">
<h3>MVC</h3>
<p>Arquitetura organizada</p>
</div>

<div class="info-card">
<h3>MongoDB</h3>
<p>Persistência real</p>
</div>

</div>

</section>

<section class="right">

<div class="form-card">

<h2>Novo Evento</h2>

<form id="eventForm">

<input type="text" placeholder="Título">

<input type="text" placeholder="Descrição">

<input type="date">

<input type="text" placeholder="Local">

<button>
Criar Evento
</button>

</form>

</div>

</section>

</main>

</body>
</html>
