<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Contato</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="background"></div>

    <header class="navbar">
        <div class="logo">
            <div class="circle"></div>
            <h1>EventHub</h1>
        </div>
        <nav>
            <a href="/">Início</a>
            <a href="/eventos.html">Eventos</a>
            <a href="/participantes.html">Participantes</a>
            <a href="/contato.html">Contato</a>
        </nav>
    </header>

    <main class="contact-container">
        <div class="contact-info">
            <h2>📞 Entre em Contato</h2>
            <p>Estamos aqui para ajudar! Envie sua mensagem.</p>
        </div>

        <div class="contact-list">
            <div class="contact-item">
                <h3>📧 E-mail</h3>
                <p>contato@eventhub.com</p>
            </div>
            <div class="contact-item">
                <h3>📱 Telefone</h3>
                <p>(51) 99999-9999</p>
            </div>
            <div class="contact-item">
                <h3>💬 WhatsApp</h3>
                <p>(51) 98888-8888</p>
            </div>
        </div>

        <div class="contact-form-card">
            <h3>Envie sua mensagem</h3>
            <form id="contactForm">
                <input type="text" id="nome" placeholder="Seu nome" required>
                <input type="email" id="email" placeholder="Seu e-mail" required>
                <textarea id="mensagem" placeholder="Sua mensagem" required></textarea>
                <button type="submit">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            alert('Mensagem enviada com sucesso! Entraremos em contato em breve.');
            document.getElementById('contactForm').reset();
        });
    </script>
</body>

</html>
