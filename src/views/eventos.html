<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Eventos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="background"></div>

    <header class="navbar">
        <div class="logo">
            <div class="circle"></div>
            <h1>EventHub</h1>
        </div>
        <nav>
            <a href="/">Início</a>
            <a href="/eventos.html">Eventos</a>
            <a href="/participantes.html">Participantes</a>
            <a href="/contato.html">Contato</a>
        </nav>
    </header>

    <main class="event-page">
        <div class="page-title">
            <h2>🎉 Eventos Disponíveis</h2>
            <p>Confira os próximos eventos e faça sua inscrição</p>
        </div>
        <div id="eventsContainer"></div>
    </main>

    <!-- Modal Editar -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 24px; padding: 40px; max-width: 500px; width: 90%; border: 1px solid rgba(139,92,246,0.5);">
            <h2 style="color: #c4b5fd; margin-bottom: 20px;">✏️ Editar Evento</h2>
            <input type="hidden" id="editId">
            <input type="text" id="editTitulo" placeholder="Título" style="width: 100%; padding: 14px; margin-bottom: 16px; background: #0f172a; border: 1px solid #8b5cf6; border-radius: 12px; color: white;">
            <textarea id="editDescricao" placeholder="Descrição" style="width: 100%; padding: 14px; margin-bottom: 16px; background: #0f172a; border: 1px solid #8b5cf6; border-radius: 12px; color: white; min-height: 100px;"></textarea>
            <input type="date" id="editData" style="width: 100%; padding: 14px; margin-bottom: 16px; background: #0f172a; border: 1px solid #8b5cf6; border-radius: 12px; color: white;">
            <input type="text" id="editLocal" placeholder="Local" style="width: 100%; padding: 14px; margin-bottom: 16px; background: #0f172a; border: 1px solid #8b5cf6; border-radius: 12px; color: white;">
            <div style="display: flex; gap: 12px;">
                <button onclick="salvarEdicao()" style="flex: 1; padding: 14px; background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer;">💾 Salvar</button>
                <button onclick="fecharModal()" style="flex: 1; padding: 14px; background: rgba(255,255,255,0.1); border: none; border-radius: 12px; color: white; cursor: pointer;">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Participar -->
    <div id="participarModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 24px; padding: 40px; max-width: 400px; width: 90%; border: 1px solid rgba(139,92,246,0.5);">
            <h2 style="color: #c4b5fd; margin-bottom: 20px;">🎟️ Participar do Evento</h2>
            <input type="hidden" id="participarId">
            <input type="text" id="participarNome" placeholder="Seu nome completo" style="width: 100%; padding: 14px; margin-bottom: 20px; background: #0f172a; border: 1px solid #8b5cf6; border-radius: 12px; color: white;">
            <div style="display: flex; gap: 12px;">
                <button onclick="confirmarParticipacao()" style="flex: 1; padding: 14px; background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer;">✅ Confirmar</button>
                <button onclick="fecharModalParticipar()" style="flex: 1; padding: 14px; background: rgba(255,255,255,0.1); border: none; border-radius: 12px; color: white; cursor: pointer;">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        async function carregarEventos() {
            try {
                const response = await fetch('/api/events');
                const eventos = await response.json();
                const container = document.getElementById('eventsContainer');
                
                if (eventos.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 60px; background: rgba(30,41,59,0.5); border-radius: 24px;"><h3 style="color: #c4b5fd;">Nenhum evento cadastrado</h3><p style="color: #94a3b8;">Crie seu primeiro evento na página inicial!</p></div>';
                    return;
                }
                
                container.innerHTML = eventos.map(evento => `
                    <div class="event-card">
                        <div class="event-top">
                            <h3>${evento.titulo}</h3>
                            <p>${evento.descricao}</p>
                        </div>
                        <div class="event-info">
                            <span class="info-box">📅 ${evento.data}</span>
                            <span class="info-box">📍 ${evento.local}</span>
                            <span class="info-box">👥 ${evento.participantes || 0} participantes</span>
                        </div>
                        ${evento.listaParticipantes && evento.listaParticipantes.length > 0 ? `
                            <div style="margin-bottom: 16px;">
                                <div style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">Participantes:</div>
                                <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                                    ${evento.listaParticipantes.map(p => `<span style="background: rgba(139,92,246,0.2); padding: 4px 10px; border-radius: 16px; font-size: 12px; color: #c4b5fd;">${p}</span>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                        <div class="event-buttons">
                            <button class="participar-btn" onclick="abrirModalParticipar('${evento._id}')">🎟️ Participar</button>
                            <button class="editar-btn" onclick="abrirModalEditar('${evento._id}')">✏️ Editar</button>
                            <button class="excluir-btn" onclick="excluirEvento('${evento._id}')">🗑️ Excluir</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function excluirEvento(id) {
            if (!confirm('Tem certeza que deseja excluir este evento?')) return;
            try {
                const response = await fetch(`/api/events/${id}`, { method: 'DELETE' });
                const resultado = await response.json();
                alert(resultado.mensagem);
                carregarEventos();
            } catch (error) {
                alert('Erro ao excluir evento');
            }
        }

        async function abrirModalEditar(id) {
            try {
                const response = await fetch(`/api/events/${id}`);
                const evento = await response.json();
                document.getElementById('editId').value = evento._id;
                document.getElementById('editTitulo').value = evento.titulo;
                document.getElementById('editDescricao').value = evento.descricao;
                document.getElementById('editData').value = evento.data;
                document.getElementById('editLocal').value = evento.local;
                document.getElementById('editModal').style.display = 'flex';
            } catch (error) {
                alert('Erro ao carregar evento');
            }
        }

        async function salvarEdicao() {
            const id = document.getElementById('editId').value;
            const evento = {
                titulo: document.getElementById('editTitulo').value,
                descricao: document.getElementById('editDescricao').value,
                data: document.getElementById('editData').value,
                local: document.getElementById('editLocal').value
            };
            try {
                const response = await fetch(`/api/events/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(evento)
                });
                const resultado = await response.json();
                alert(resultado.mensagem);
                fecharModal();
                carregarEventos();
            } catch (error) {
                alert('Erro ao salvar');
            }
        }

        function abrirModalParticipar(id) {
            document.getElementById('participarId').value = id;
            document.getElementById('participarNome').value = '';
            document.getElementById('participarModal').style.display = 'flex';
        }

        async function confirmarParticipacao() {
            const id = document.getElementById('participarId').value;
            const nome = document.getElementById('participarNome').value;
            if (!nome.trim()) {
                alert('Digite seu nome!');
                return;
            }
            try {
                const response = await fetch(`/api/events/${id}/participar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nomeParticipante: nome })
                });
                const resultado = await response.json();
                alert(resultado.mensagem);
                fecharModalParticipar();
                carregarEventos();
            } catch (error) {
                alert('Erro ao participar');
            }
        }

        function fecharModal() { document.getElementById('editModal').style.display = 'none'; }
        function fecharModalParticipar() { document.getElementById('participarModal').style.display = 'none'; }

        window.onclick = function(event) {
            if (event.target === document.getElementById('editModal')) fecharModal();
            if (event.target === document.getElementById('participarModal')) fecharModalParticipar();
        }

        carregarEventos();
    </script>
</body>

</html>
